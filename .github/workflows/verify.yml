name: Verify game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Assets, rules and replays
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-package-lock
      - name: Read Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Kept between runs, so that a package server outage cannot stop the job (see the script).
      - name: Restore Chromium system libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/system-libraries
          key: system-libraries-${{ steps.playwright.outputs.image }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system libraries
        run: scripts/ci/system-libraries.sh chromium
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Verify assets, rules and recorded behaviour
        run: npm test
      # For people reviewing a layout change: every layout size, start screen and mid-round,
      # and the tap marks frozen part-way (tap-penguin, tap-fox, tap-bear, tap-empty).
      - name: Take review screenshots
        if: always()
        # The tap mark pictures are only for looking at, so they may fail without failing the job.
        run: node scripts/screenshots.mjs && (node scripts/review-effects.mjs || echo '::warning title=No tap mark pictures::scripts/review-effects.mjs failed')
      - name: Save audit and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-report
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  # The same gate in the other two engines, after it has passed in Chromium.
  # Both must pass. An engine marked "experimental" would report without blocking: its job
  # stays green and carries a warning (none is marked now).
  browsers:
    name: Assets, rules and replays on ${{ matrix.browser }}
    needs: verify
    # Playwright 1.56 ships Firefox and WebKit builds for Ubuntu 24.04, not yet for the newer ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            experimental: false
          - browser: firefox
            experimental: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-package-lock
      - name: Read Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore ${{ matrix.browser }}
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      # Kept between runs, so that a package server outage cannot stop the job (see the script).
      - name: Restore ${{ matrix.browser }} system libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/system-libraries
          key: system-libraries-${{ steps.playwright.outputs.image }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install ${{ matrix.browser }} system libraries
        run: scripts/ci/system-libraries.sh ${{ matrix.browser }}${{ matrix.browser == 'firefox' && ' pulseaudio' || '' }}
      - name: Install ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
      # Firefox on Linux plays Web Audio through PulseAudio. The runner has no sound server,
      # so audio time never moves: music starts but never fades or ends. A silent sink fixes it.
      # PulseAudio itself is installed with the system libraries above.
      - name: Give Firefox a silent sound card
        if: matrix.browser == 'firefox'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
      - name: Verify assets, rules and recorded behaviour
        id: gate
        # An experimental engine may fail here without failing the job; the next step says so out loud.
        continue-on-error: ${{ matrix.experimental }}
        run: npm test
        env:
          WAM_BROWSER: ${{ matrix.browser }}
      - name: Take review screenshots
        if: always()
        # The tap mark pictures are only for looking at, so they may fail without failing the job.
        run: node scripts/screenshots.mjs && (node scripts/review-effects.mjs || echo '::warning title=No tap mark pictures::scripts/review-effects.mjs failed')
        env:
          WAM_BROWSER: ${{ matrix.browser }}
      - name: Report a failure that does not block
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::warning title=${{ matrix.browser }} gate failed (not blocking)::The gate fails in ${{ matrix.browser }}. Known failures are listed in tests/support/browser.mjs; anything beyond them is new."
          echo "### The gate failed in ${{ matrix.browser }} (not blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "Known failures are listed in \`tests/support/browser.mjs\`. The full output is in this job's log and in the \`verification-report-${{ matrix.browser }}\` artifact." >> "$GITHUB_STEP_SUMMARY"
      - name: Save audit and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-report-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  # Tests the tests. Every case runs the whole browser suite, so each runner takes
  # one case at a time and the list is split across runners instead.
  mutation:
    name: Mutation check ${{ matrix.shard }}/5
    needs: verify
    runs-on: ubuntu-latest
    # About 20 cases a runner at 50-55 s each: under 20 minutes of work, so leave room.
    # The shard count is also in the job name, which branch protection lists by name:
    # change the count and the required checks on main together.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-package-lock
      - name: Read Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Kept between runs, so that a package server outage cannot stop the job (see the script).
      - name: Restore Chromium system libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/system-libraries
          key: system-libraries-${{ steps.playwright.outputs.image }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system libraries
        run: scripts/ci/system-libraries.sh chromium
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Check that the tests catch broken rules
        run: npm run test:mutation -- --strict --shard ${{ matrix.shard }}/5
        env:
          MUTATION_WORKERS: '1'
      - name: Save mutation report and failing output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
