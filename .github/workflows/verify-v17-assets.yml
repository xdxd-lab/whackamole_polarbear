name: Verify V17 character assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assets:
    name: AVIF checksum, dimensions, decode and game smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify 3 official AVIF files and all 15 poses
        run: node scripts/verify-assets.mjs
      - name: Save machine-readable audit and browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-asset-audit
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
