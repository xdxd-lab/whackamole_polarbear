    el.classList.toggle('bad',a.type==='bad');
    const area=fx.getBoundingClientRect(),box=a.h.getBoundingClientRect(),half=el.offsetWidth/2+4;
    el.style.left=Math.min(Math.max(box.left+box.width/2-area.left,half),area.width-half)+'px';
    el.style.top=Math.max(box.top-area.top+10,el.offsetHeight+2)+'px';
    void el.offsetWidth;el.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),550);
  }
  function resetHole(h){
    // Hide BEFORE cancelling animations or releasing position locks.
    // A hidden outgoing sprite must never flash at its idle position.
    h.dataset.state='hidden';
    const m=h.querySelector('.mole');m.style.visibility='hidden';
    m.getAnimations({subtree:true}).forEach(a=>a.cancel());
    h.className='hole';delete h.dataset.character;delete h.dataset.outcome;
    m.className='mole';m.removeAttribute('style');
    h.setAttribute('aria-label',`洞 ${holes.indexOf(h)+1}`);
  }
  function resetAll(){if(actor)resetHole(actor.h);actor=null;}
  function setState(a,state){
    a.phase=state;a.h.dataset.state=state;
    a.h.classList.remove(...states.map(s=>`${a.species}-${s}`));
    if(state!=='peek') a.h.classList.add(`${a.species}-${state}`);
    const img=a.m.querySelector(`.${a.species}-img`);
    img.src=sprites[a.species][state];
    // These are outcome branches, NOT an automatic five-frame slideshow.
    a.h.setAttribute('aria-label',`${names[a.species]}，${state==='peek'||state==='warning'?(a.type==='bad'?'別打！':a.type==='bonus'?'+3 分':'+1 分'):'已離開可打擊階段'}`);
  }
  function spawn(){
    if(!running)return;
    resetAll();
    let i;do{i=Math.floor(Math.random()*holes.length);}while(i===lastHole);lastHole=i;
    const r=Math.random(),type=r<.12?'bad':r<.34?'bonus':'normal';
    const h=holes[i],m=h.querySelector('.mole'),species=speciesByType[type];
    const cfg=settings[difficulty.value]||settings.normal;
    const recovered=Math.round((cfg.spawn-cfg.show)*.5);
    const warningAt=Math.round(cfg.show*.62)+recovered;
    const hideAt=cfg.show+recovered;
    const a={i,h,m,type,species,phase:'peek',deadline:performance.now()+hideAt,warningTimer:null,hideTimer:null,nextTimer:null};
    actor=a;h.dataset.character=species;
    m.className=`mole ${type}`;h.classList.add('up',`${species}-active`);
    setState(a,'peek');
    a.warningTimer=later(()=>{if(actor===a&&a.phase==='peek')setState(a,'warning');},warningAt);
    a.hideTimer=later(()=>escape(a),hideAt);
    a.nextTimer=later(spawn,cfg.spawn);
  }
  function escape(a){
    if(actor!==a||!['peek','warning'].includes(a.phase))return;
    cancel(a.warningTimer);a.h.dataset.outcome='escape';
    a.h.classList.remove('up');setState(a,'sneaky');
    if(a.type!=='bad')combo=0;
    update();
    // v8's short escape window is retained: 135/125/90 ms.
    // The already scheduled next spawn clears this actor.
  }
  function hit(i){
    const a=actor;
    if(!running||!a||a.i!==i||!['peek','warning'].includes(a.phase))return;
    if(performance.now()>=a.deadline){escape(a);return;}
    cancel(a.warningTimer);cancel(a.hideTimer);cancel(a.nextTimer);
    // Lock the on-screen anchor before removing .up. The former code
    // fell to bottom:-70% here and then rose to -8% at the sad frame.
    const cs=getComputedStyle(a.m);
    a.m.style.bottom=cs.bottom;
    a.m.style.left=cs.left;
    a.m.style.transition='none';
    a.h.dataset.outcome='hit';a.h.classList.remove('up');
    setState(a,'pain');bonk(a);
    let delta;
    if(a.type==='bad'){
      delta=-2;combo=0;beep(120,.12,'sawtooth',.16);vibrate(55);showToast('誤敲北極熊 -2',a);
    }else{
      delta=a.type==='bonus'?3:1;combo++;maxCombo=Math.max(maxCombo,combo);
      beep(a.type==='bonus'?760:420+Math.min(combo,12)*25,.07,a.type==='bonus'?'triangle':'sine');
      vibrate(a.type==='bonus'?18:10);
      if(combo%5===0){delta++;showToast(`連擊獎勵 +${delta}`,a);}
      else showToast(`${names[a.species]} +${delta}`,a);
    }
    score=Math.max(0,score+delta);update();
    later(()=>{
      if(actor!==a||a.phase!=='pain')return;
      setState(a,'sad');
      // Anchor stays fixed. Only this animation moves the outgoing sprite,
      // in one direction: down. No peek/sneaky callbacks survive a hit.
      const distance=Math.max(0,a.h.clientHeight-a.m.offsetTop+2);
      a.m.animate([{transform:'translateY(0px)'},{transform:`translateY(${distance}px)`}],
        {duration:340,easing:'ease-in',fill:'forwards'});
      later(()=>{
        if(actor!==a)return;
        resetHole(a.h);actor=null;later(spawn,80);
      },340);
    },220);
    return a.type;
  }
  // Feedback only. Nothing below reads or changes the score, the clock or the rules.
  function tap(i,e){
    if(!running)return;
    ripple(i,e,hit(i)||'miss');
  }
  function ripple(i,e,kind){
    const area=fx.getBoundingClientRect(),box=holes[i].getBoundingClientRect();
    const pointed=e&&(e.clientX||e.clientY);
    const x=(pointed?e.clientX:box.left+box.width/2)-area.left,y=(pointed?e.clientY:box.top+box.height/2)-area.top;
    const size=box.width,grow=calm.matches?.5:1.5;
    const draw=(className,from,to,opacity)=>{
      const el=document.createElement('i');el.className=`${className} ${kind}`;el.style.left=x+'px';el.style.top=y+'px';
      fx.appendChild(el);
      const remove=()=>el.remove();
      el.animate([{opacity,width:from+'px',height:from+'px'},{opacity:0,width:to+'px',height:to+'px'}],{duration:350,easing:'ease-out'}).finished.then(remove,remove);
    };
    draw('ripple',size*.5,size*grow,1);
    if(kind!=='miss')draw('dot',size*.4,size*.4,.85);
  }
  function bonk(a){
    if(calm.matches)return;
    const img=a.m.querySelector(`.${a.species}-img`),at='translateX(-50%) ';
    img.animate(a.type==='bad'
      ?[0,-5,5,-3,3,0].map(x=>({transform:`${at}translateX(${x}%)`}))
      :[{transform:at+'scale(1)'},{transform:at+'scale(1.14,.84)',offset:.3},{transform:at+'scale(.96,1.05)',offset:.65},{transform:at+'scale(1)'}],{duration:200});
  }
  const images=[];
  const assetsReady=Promise.all(Object.values(sprites).flatMap(set=>Object.values(set)).map(url=>new Promise((resolve,reject)=>{
    const img=new Image();images.push(img);
    img.onload=()=>{
      if(!img.naturalWidth){reject(new Error('空白圖片'));return;}
      (typeof img.decode==='function'?img.decode():Promise.resolve()).then(resolve,reject);
    };
    img.onerror=()=>reject(new Error('角色圖片載入失敗'));img.src=url;
  }))).then(()=>{ready=true;}).catch(e=>{loadError=e;});
  // Background music: one track per round, taking turns. Fetched only after the game is
  // playable and decoded off-screen, so it never delays the first round; it starts only
  // from the player's tap, and a track that cannot load leaves the game silent, not broken.
  const MUSIC_TRACKS=[{"opus":"assets/music-20261110/happy-fc436405b0a7.opus","m4a":"assets/music-20261110/happy-5e3a15364b4c.m4a"},{"opus":"assets/music-20261110/winter-a62906d44807.opus","m4a":"assets/music-20261110/winter-97f374c4eb94.m4a"}];
  const MUSIC_VOLUME=.35;
  const musicFormats=new Audio().canPlayType('audio/ogg; codecs=opus')?['opus','m4a']:['m4a','opus'];
  const music={loads:[],next:0,playing:null,gain:null};
  async function decodeTrack(i){
    for(const format of musicFormats){
      try {
        const response=await fetch(MUSIC_TRACKS[i][format]);
        if(!response.ok)continue;
        return await new OfflineAudioContext(2,1,44100).decodeAudioData(await response.arrayBuffer());
      } catch (_) {}
    }
    return null;
  }
  // One at a time, in the order they will play.
  function track(i){return music.loads[i] ||= (i?track(i-1):Promise.resolve()).then(()=>decodeTrack(i));}
  assetsReady.then(()=>track(MUSIC_TRACKS.length-1));
  function playMusic(){
    stopMusic();
    const i=music.next;music.next=(i+1)%MUSIC_TRACKS.length;
    const generation=session;
    track(i).then(buffer=>{
      if(!buffer||!running||generation!==session||!audio())return;
      if(!music.gain){music.gain=audioCtx.createGain();music.gain.connect(audioCtx.destination);}
      music.gain.gain.value=soundOn?MUSIC_VOLUME:0;
      const source=audioCtx.createBufferSource(),fade=audioCtx.createGain();
      source.buffer=buffer;source.connect(fade);fade.connect(music.gain);
      // A track that arrives late joins the round where it is, so it still ends with it.
      source.start(0,Math.min(buffer.duration,Math.max(0,(performance.now()-started)/1000)));
      const playing={source,fade};music.playing=playing;
      source.onended=()=>{source.disconnect();fade.disconnect();if(music.playing===playing)music.playing=null;};
    });
  }
  function stopMusic(){
    const playing=music.playing;music.playing=null;
    if(!playing)return;
    const t=audioCtx.currentTime;
    playing.fade.gain.setValueAtTime(playing.fade.gain.value,t);
    playing.fade.gain.linearRampToValueAtTime(0,t+.25);
    playing.source.stop(t+.25);
  }
  async function start(){
    if(loading)return;
    // Resume audio inside the user gesture, before waiting for images.
    audio();beep(520,.08,'triangle');
    if(!ready){
      loading=true;startBtn.disabled=true;modalBtn.disabled=true;
      const label=modalBtn.textContent;modalBtn.textContent='圖片載入中…';
      await assetsReady;loading=false;startBtn.disabled=false;modalBtn.disabled=false;modalBtn.textContent=label;
    }
    if(loadError){
      $('modalTitle').textContent='圖片未載入完成';
      $('modalText').textContent='請重新開啟這份完整遊戲檔，或重新整理網頁。遊戲不會以舊圖代替缺少的圖片。';
      overlay.classList.add('show');return;
    }
    session++;clearTimers();clearInterval(clockTimer);resetAll();
    score=0;combo=0;maxCombo=0;timeLeft=30;running=true;started=performance.now();
    overlay.classList.remove('show');$('finalScore').hidden=true;update();spawn();playMusic();
    clockTimer=setInterval(()=>{
      timeLeft=Math.max(0,30-(performance.now()-started)/1000);
      if(timeLeft===0)finish();update();
    },100);
  }
  function finish(){
    if(!running)return;
    running=false;session++;clearTimers();clearInterval(clockTimer);resetAll();
    stopMusic();beep(260,.09,'triangle');
    if(score>best){
      best=score;try{localStorage.setItem(BEST_KEY,String(best));}catch(_){}
      $('best').textContent=best;$('modalTitle').textContent='🏆 新紀錄！';
    }else $('modalTitle').textContent='時間到！';
    $('finalScore').textContent=score;$('finalScore').hidden=false;
    $('modalText').innerHTML=`你這局得到 <b>${score}</b> 分，最高連擊 <b>${maxCombo}</b>。再來一局挑戰更高分吧！`;
    modalBtn.textContent='再玩一次';overlay.classList.add('show');update();
  }
  startBtn.addEventListener('click',start);modalBtn.addEventListener('click',start);
  $('soundBtn').addEventListener('click',()=>{
    soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 音效':'🔇 靜音';
    $('soundBtn').setAttribute('aria-pressed',String(soundOn));
    if(soundOn)beep(520);else activeAudio.forEach(o=>{try{o.stop();}catch(_){}});
    if(music.gain)music.gain.gain.setTargetAtTime(soundOn?MUSIC_VOLUME:0,audioCtx.currentTime,.03);
  });
  difficulty.addEventListener('change',()=>{if(running)start();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)finish();});
  document.documentElement.dataset.gameVersion=VERSION;
  update();
})();
</script>
