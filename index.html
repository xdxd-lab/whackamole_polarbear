<title>雪地敲敲樂｜打企鵝・北極狐 V22</title>
<style>
  :root{
    --sky-top:#8fd8ff; --sky-mid:#cfeeff; --sky-bottom:#eef9ff;
    --snow:#f8fdff; --snow-shadow:#d9ecf8;
    --panel:rgba(255,255,255,.94); --ink:#23302a; --accent:#ffb703; --danger:#ef476f;
    --good:#2a9d8f; --hole:#27414f; --shadow:0 14px 36px rgba(28,58,42,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);overscroll-behavior:none}
  body{
    height:100vh;height:100dvh;display:flex;justify-content:center;align-items:center;
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
    user-select:none;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 20% 18%, rgba(255,255,255,.82) 0 5%, transparent 6%),
      radial-gradient(circle at 76% 14%, rgba(255,255,255,.68) 0 4%, transparent 5%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-bottom) 68%, #f4fbff 100%);
  }
  body:before{
    content:"";position:fixed;left:-8%;right:-8%;bottom:0;height:43vh;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 95% at 8% 100%, #ffffff 0 45%, transparent 46%),
      radial-gradient(100% 90% at 34% 100%, #f6fbff 0 43%, transparent 44%),
      radial-gradient(110% 85% at 68% 100%, #edf7ff 0 42%, transparent 43%),
      radial-gradient(115% 90% at 94% 100%, #ffffff 0 46%, transparent 47%);
  }
  body:after{
    content:"";position:fixed;left:0;right:0;bottom:0;height:24vh;pointer-events:none;z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(248,252,255,.85) 16%, rgba(244,250,255,.96) 100%);
    box-shadow:0 -18px 50px rgba(255,255,255,.55) inset;
  }
  /* Each layer falls exactly one tile of its own pattern per loop, so the loop has no seam.
     The slant comes from leaning the whole layer, which keeps that true. */
  .snow-layer{position:fixed;left:-20vw;right:-20vw;top:calc(-10vh - var(--tile));bottom:-10vh;pointer-events:none;z-index:1;will-change:transform;background-repeat:repeat;background-size:var(--tile) var(--tile);rotate:var(--lean);animation:snowfall var(--fall) linear infinite}
  .snow-back{
    --tile:280px;--fall:6s;--lean:2deg;opacity:.42;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.95) 0 1.2px, transparent 1.6px),
      radial-gradient(circle, rgba(255,255,255,.85) 0 1.8px, transparent 2.2px),
      radial-gradient(circle, rgba(255,255,255,.75) 0 1px, transparent 1.4px);
    background-position: 0 0, 120px 40px, 40px 140px;
  }
  .snow-mid{
    --tile:220px;--fall:3.2s;--lean:-3deg;opacity:.58;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.96) 0 1.8px, transparent 2.4px),
      radial-gradient(circle, rgba(255,255,255,.88) 0 2.6px, transparent 3.1px),
      radial-gradient(circle, rgba(255,255,255,.8) 0 1.4px, transparent 1.9px);
    background-position: 24px 0, 138px 78px, 76px 150px;
  }
  .snow-front{
    --tile:170px;--fall:1.8s;--lean:4deg;opacity:.72;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.98) 0 2.2px, transparent 2.9px),
      radial-gradient(circle, rgba(255,255,255,.92) 0 3.2px, transparent 3.9px),
      radial-gradient(circle, rgba(255,255,255,.85) 0 1.6px, transparent 2.1px);
    background-position: 0 12px, 94px 70px, 30px 130px;
  }
  @keyframes snowfall{to{transform:translateY(var(--tile))}}
  .cloud,.cloud:before,.cloud:after{position:fixed;background:#fff;border-radius:999px;opacity:.8;pointer-events:none;z-index:1}.cloud{width:92px;height:30px;top:7%;left:7%;filter:blur(.2px)}.cloud:before{content:"";width:40px;height:40px;left:13px;top:-18px}.cloud:after{content:"";width:52px;height:52px;right:8px;top:-25px}.cloud.two{transform:scale(.75);left:auto;right:8%;top:15%}
  /* A column that fits the screen: only the board gives up height. Flex, not grid, because
     Firefox does not shrink a grid's auto row to the container's max-height. */
  .game{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}.game>*{flex:none}.game>.card{flex:0 1 auto}
  .top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
  .brand,.scoreboard,.controls,.card{background:var(--panel);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:22px}
  .brand{padding:15px 18px}.brand h1{font-size:clamp(24px,5vw,36px);line-height:1;margin:0 0 5px;display:flex;align-items:center;gap:.2em}.toy-mallet{width:1.25em;height:1.25em;flex:none;filter:drop-shadow(0 2px 2px rgba(92,48,67,.2))}.brand p{margin:0;font-size:13px;opacity:.7}
  .scoreboard{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));overflow:hidden}.stat{padding:10px 12px;text-align:center;min-width:72px;display:flex;flex-direction:column;justify-content:center}.stat+.stat{border-left:1px solid #dde7df}.label{font-size:11px;opacity:.58;font-weight:700;letter-spacing:.05em}.value{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}.value.hot{color:var(--danger)}
  .card{padding:14px;aspect-ratio:1/1;min-height:0;place-self:stretch;container-type:size}.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(8px,2vw,14px);width:100%;aspect-ratio:1/1;width:min(100cqw,100cqh);height:min(100cqw,100cqh);margin:auto}
  .hole{position:relative;overflow:hidden;border:0;padding:0;margin:0;font:inherit;color:inherit;appearance:none;border-radius:24px;cursor:pointer;touch-action:manipulation;isolation:isolate;background:linear-gradient(180deg,#fbfdff 0%,#e4f1fa 62%,#d3e7f4 100%);box-shadow:inset 0 2px 0 #fff,inset 0 -10px 16px rgba(110,160,198,.16),0 2px 0 rgba(126,170,204,.4)}
  .hole:focus-visible{outline:3px solid #1769c4;outline-offset:2px}
  .hole:before{content:"";position:absolute;left:11%;right:11%;bottom:9%;height:29%;background:radial-gradient(ellipse at 50% 30%,#172a35 0 45%,var(--hole) 100%);border-radius:50%;box-shadow:inset 0 6px 0 rgba(0,0,0,.22),0 0 0 4px #fff,0 5px 0 4px rgba(150,190,216,.5);z-index:1}
  .mole{position:absolute;left:4%;width:92%;height:92%;bottom:-70%;z-index:2;display:flex;align-items:flex-end;justify-content:center;transition:bottom .14s cubic-bezier(.2,.85,.3,1.18),transform .08s;filter:drop-shadow(0 5px 3px rgba(0,0,0,.08));pointer-events:none}
  .hole.penguin-active:before,.hole.bear-active:before,.hole.fox-active:before{opacity:0}
  .hole[data-state="hidden"] .mole{visibility:hidden}
  .hole.up .mole{bottom:8%}
  /* One verified sheet per species; a state only moves background-position, so no image is swapped or re-decoded.
     The move must be a cut, never a slide: reduced motion gives every property a (very short) transition, so the sprite opts out. */
  .mole{container-type:size}
  .sprite{display:none;position:absolute;left:50%;bottom:0;transform:translateX(-50%);aspect-ratio:var(--ratio);width:min(100cqw,calc(100cqh * var(--ratio)));background:var(--sheet) 0 0/500% 100% no-repeat;transform-origin:50% 100%;transition:none!important}
  .mole.normal .sprite{display:block;--sheet:var(--sheet-penguin);--ratio:1.5}.mole.bad .sprite{display:block;--sheet:var(--sheet-bear);--ratio:1}.mole.bonus .sprite{display:block;--sheet:var(--sheet-fox);--ratio:1}
  .hole[data-state="warning"] .sprite{background-position-x:25%}.hole[data-state="sneaky"] .sprite{background-position-x:50%}.hole[data-state="pain"] .sprite{background-position-x:75%}.hole[data-state="sad"] .sprite{background-position-x:100%}
  .hole.bear-warning .mole,.hole.fox-warning .mole,.hole.penguin-warning .mole{animation:bearwarn .18s ease-in-out 2}
  .hole.bear-warning .mole{bottom:2%;left:2%}
  .hole.bear-sneaky .mole,.hole.fox-sneaky .mole,.hole.penguin-sneaky .mole{bottom:0%;transition:bottom .18s ease-in}
  .hole.bear-sneaky .mole{bottom:-6%;left:6%}
  @keyframes bearwarn{50%{transform:translateY(-3px) rotate(-1deg)}}

  /* Touch feedback, a small magic mallet: a see-through glow where the tap landed, a ring that
     spreads from it and, on a hit, stars thrown outwards. Only transform and opacity move. */
  .fx{position:absolute;inset:0;pointer-events:none;z-index:5}
  .ripple,.dot,.spark{position:absolute;translate:-50% -50%;opacity:0;--c:111,168,208}
  .ripple{border-radius:50%;border:3px solid rgba(var(--c),.7);background:radial-gradient(closest-side,rgba(var(--c),0) 55%,rgba(var(--c),.26))}
  .dot{border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.8),rgba(var(--c),.5) 55%,rgba(var(--c),0))}
  .spark{background:rgba(var(--c),.9);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
  .spark.bad{clip-path:polygon(50% 0,100% 100%,0 100%)}
  .fx .normal{--c:42,157,143}.fx .bonus{--c:255,183,3}.fx .bad{--c:239,71,111}

  /* Version and music credits: small and pale, in the corner, never competing with the game. */
  .foot{text-align:center;container-type:inline-size}.foot span{display:inline-block}.foot>span:first-child{white-space:nowrap}@container (max-width:330px){.foot .date{display:none}}.foot span[hidden]{display:none}#bestSlot{position:relative}#practiceMark{position:absolute;left:50%;top:0;translate:-50% 0;white-space:nowrap}.practice{color:#9a3c06;font-weight:800;background:rgba(255,183,3,.24);border-radius:.4em;padding:0 .2em}.credits{font-size:11px;color:#6b7f8c;margin-left:.6em}.credits a{color:inherit;text-decoration:underline;text-decoration-color:rgba(107,127,140,.45);text-underline-offset:2px}.credits a:focus-visible{outline:2px solid #1769c4;outline-offset:2px}.credits .names{display:contents}.credits .short{display:none}
  /* Where the names would be cut short, one link to the full credits stands for them (fitCredits). */
  .credits.brief .names,.credits.brief .label{display:none}.credits.brief .short{display:inline}
  /* Where the credits need a line of their own, that line sits in the page's bottom margin and takes no height from the game. */
  @media(max-width:560px),(orientation:landscape) and (max-height:560px){.foot .credits{display:flex;justify-content:center;white-space:nowrap;margin:0 0 -13px;font-size:10.5px;line-height:13px}.foot .credits a{min-width:0;overflow:hidden;text-overflow:ellipsis}.foot .credits .label{display:none}.foot .credits:before{content:"♪ "}}

  .controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:12px}.btn,select{border:0;border-radius:15px;font:inherit;font-weight:800}.btn{padding:13px 17px;background:#fff;box-shadow:inset 0 0 0 1px #dce7df;cursor:pointer}.btn.primary{background:var(--accent);box-shadow:none}.btn:active{transform:translateY(1px)}select{padding:0 34px 0 14px;background:#fff;min-width:118px}
  .progress{height:8px;background:rgba(255,255,255,.5);border-radius:999px;overflow:hidden}.bar{height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--accent),var(--danger));transform-origin:left;transition:transform .1s linear}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(226,240,250,.86);z-index:20;border-radius:22px;opacity:0;visibility:hidden;pointer-events:none;transition:.2s}.overlay.show{opacity:1;visibility:visible;pointer-events:auto}.modal{width:min(410px,88%);background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 0 0 1px rgba(120,165,200,.28),0 18px 44px rgba(40,80,110,.22)}.modal h2{font-size:31px;margin:0 0 8px}.modal p{margin:7px 0 18px;line-height:1.6}.bigscore{font-size:52px;font-weight:950;color:var(--good);line-height:1}.tiny{font-size:12px;opacity:.62}
  .toast{position:absolute;left:50%;top:14px;translate:0 -100%;white-space:nowrap;transform:translate(-50%,-8px);z-index:30;font-weight:900;font-size:clamp(17px,5cqw,24px);line-height:1.2;padding:2px 12px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(40,80,110,.18);opacity:0;pointer-events:none}.toast.bad{color:var(--danger)}.toast.show{animation:pop .55s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,4px) scale(.8)}25%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-28px) scale(1)}}
  @media(max-width:560px){body{align-items:start}.top{grid-template-columns:1fr}.brand{text-align:center}.brand h1{justify-content:center}.scoreboard{min-height:68px}.card{padding:10px}.board{gap:6px}.hole{border-radius:18px}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1;grid-row:1}.controls select{width:100%;min-height:45px}.controls .btn:not(.primary){min-height:45px}}
  @media(orientation:landscape) and (max-height:560px){.game{display:grid;--side:calc(100dvh - max(14px,env(safe-area-inset-top)) - max(14px,env(safe-area-inset-bottom)));width:100%;max-width:1040px;grid-template-columns:auto minmax(0,1fr);grid-template-rows:1fr auto auto auto 1fr auto;gap:8px 12px}.game>:not(.card){grid-column:2}.top{grid-row:2}.progress{grid-row:3}.controls{grid-row:4}.game>.foot{grid-row:6}.card{grid-column:1;grid-row:1/-1;width:var(--side);height:var(--side);aspect-ratio:auto;padding:10px}.board{gap:6px}.hole{border-radius:18px}.top{grid-template-columns:1fr;gap:8px}.brand{padding:8px 12px;text-align:center}.brand h1{justify-content:center;font-size:22px;margin:0 0 2px}.brand p{font-size:12px}.scoreboard{min-height:0}.stat{padding:5px 8px}.value{font-size:20px}.controls{grid-template-columns:1fr 1fr;gap:8px;padding:8px}.controls .primary{grid-column:1/-1;grid-row:1}.controls .btn{padding:9px 12px;min-height:44px}.controls select{width:100%;min-height:44px}}
  @media(orientation:landscape) and (max-height:340px){.brand{padding:4px 8px}.brand h1{font-size:18px;margin:0}.brand p{display:none}}
  @container (max-height:320px){.modal{padding:12px 16px;border-radius:18px}.modal h2{font-size:22px;margin:0 0 2px}.modal p{margin:4px 0 8px;line-height:1.35;font-size:14px}.modal .tiny{display:none}.bigscore{font-size:34px}.modal .btn{padding:9px 14px}}
  @media(max-width:560px) and (max-height:620px){.brand{padding:8px 12px}.brand h1{font-size:22px;margin:0}.brand p{display:none}.scoreboard{min-height:0}.stat{padding:5px 8px}.value{font-size:20px}.game{gap:8px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.snow-layer{animation:none;will-change:auto}.toast.show{animation:none;opacity:1;transform:translate(-50%,-8px)}}
</style>

<body>
<div class="cloud"></div><div class="cloud two"></div>
<div class="snow-layer snow-back" aria-hidden="true"></div>
<div class="snow-layer snow-mid" aria-hidden="true"></div>
<div class="snow-layer snow-front" aria-hidden="true"></div>
<main class="game" aria-label="打企鵝與北極狐遊戲">

    <div class="brand"><h1><svg class="toy-mallet" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可愛的粉紅玩具槌子">

<script>(async () => {
  'use strict';
  const VERSION = '22.0.0';
  const BEST_KEY = 'wam_best_20260904v7';
  // One best score per difficulty. Normal keeps the key every earlier version wrote to.
  const BEST_KEYS = {easy: BEST_KEY+'_easy', normal: BEST_KEY, hard: BEST_KEY+'_hard'};
  const $ = id => document.getElementById(id);
  const board = $('board'), overlay = $('overlay');
  const startBtn = $('startBtn'), modalBtn = $('modalBtn'), difficulty = $('difficulty');
  // spawn: from one target to the next when nothing is hit. show: how long a target stays, before
  // the half of the spare time it gets back (see spawn()). pain, sad, rest: after a hit, the two
  // frames of the animal going down and the wait for the next one. Normal is the reference; the
  // other two are set apart from it by about a third.
  const settings = {
    easy: {spawn: 1150, show: 850, pain: 220, sad: 340, rest: 240},
    normal: {spawn: 850, show: 600, pain: 220, sad: 340, rest: 80},
    hard: {spawn: 550, show: 410, pain: 160, sad: 240, rest: 50}
  };
  const states = ['peek','warning','sneaky','pain','sad'];

    $('finalScore').textContent=score;$('finalScore').hidden=false;
    $('modalText').innerHTML=practice
      ?`<b><span class="practice">練習局</span>，不計入紀錄</b>（這局中途改了難度）。你得到 <b>${score}</b> 分，最高連擊 <b>${maxCombo}</b>。再玩一次就是正式局。`
      :`你這局得到 <b>${score}</b> 分，最高連擊 <b>${maxCombo}</b>。再來一局挑戰更高分吧！`;
    showBest();
    modalBtn.textContent='再玩一次';overlay.classList.add('show');update();
  }
  startBtn.addEventListener('click',start);modalBtn.addEventListener('click',()=>paused?resume():start());
  $('soundBtn').addEventListener('click',()=>{
    soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 音效':'🔇 靜音';
    $('soundBtn').setAttribute('aria-pressed',String(soundOn));
    if(soundOn)beep(520);else activeAudio.forEach(o=>{try{o.stop();}catch(_){}});
    if(music.gain)music.gain.gain.setTargetAtTime(soundOn?MUSIC_VOLUME:0,audioCtx.currentTime,.03);
  });
  difficulty.addEventListener('change',()=>{
    if(running){roundLevel=level();practice=true;}
    showBest();
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  document.documentElement.dataset.gameVersion=VERSION;
  update();
})();
</script>
