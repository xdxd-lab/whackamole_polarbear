<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7BC96F" />
<title>打企鵝・北極狐｜離線版</title>
<style>
  :root{
    --sky:#bfe8ff; --grass:#8ed56f; --grass2:#70bf59; --soil:#8b5a38;
    --panel:rgba(255,255,255,.9); --ink:#23302a; --accent:#ffb703; --danger:#ef476f;
    --good:#2a9d8f; --hole:#493126; --shadow:0 14px 36px rgba(28,58,42,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);background:linear-gradient(var(--sky) 0 42%,var(--grass) 42% 100%);overscroll-behavior:none}
  body{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));user-select:none}
  .cloud,.cloud:before,.cloud:after{position:fixed;background:#fff;border-radius:999px;opacity:.74;pointer-events:none}.cloud{width:92px;height:30px;top:7%;left:7%}.cloud:before{content:"";width:40px;height:40px;left:13px;top:-18px}.cloud:after{content:"";width:52px;height:52px;right:8px;top:-25px}.cloud.two{transform:scale(.75);left:auto;right:8%;top:15%}
  .game{width:min(680px,100%);display:grid;gap:12px;position:relative;z-index:2}
  .top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
  .brand,.scoreboard,.controls,.card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);border-radius:22px}
  .brand{padding:15px 18px}.brand h1{font-size:clamp(24px,5vw,36px);line-height:1;margin:0 0 5px}.brand p{margin:0;font-size:13px;opacity:.7}
  .scoreboard{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr));overflow:hidden}.stat{padding:10px 12px;text-align:center;min-width:72px}.stat+.stat{border-left:1px solid #dde7df}.label{font-size:11px;opacity:.58;font-weight:700;letter-spacing:.05em}.value{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}.value.hot{color:var(--danger)}
  .card{padding:14px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,14px);aspect-ratio:1/1;max-height:66dvh}
  .hole{position:relative;overflow:hidden;border-radius:24px;cursor:pointer;touch-action:manipulation;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.03))}
  .hole:before{content:"";position:absolute;left:9%;right:9%;bottom:7%;height:31%;background:var(--hole);border-radius:50%;box-shadow:inset 0 8px 0 rgba(0,0,0,.2),0 5px 0 rgba(255,255,255,.16);z-index:1}
  .mole{position:absolute;left:13%;width:74%;height:80%;bottom:-70%;z-index:2;transition:bottom .14s cubic-bezier(.2,.85,.3,1.18),transform .08s;filter:drop-shadow(0 7px 4px rgba(0,0,0,.15));pointer-events:none}
  .hole.up .mole{bottom:8%}.hole.hit .mole{transform:translateY(9%) scale(.94)}
  .character{display:none;width:100%;height:100%;overflow:visible}.mole.normal .penguin,.mole.bonus .fox{display:block}.bear-img{display:none;width:118%;height:112%;margin-left:-9%;object-fit:contain;object-position:center bottom}.mole.bad .bear-img{display:block}
  .character .outline{stroke:#26332d;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.character .soft{stroke:#26332d;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .penguin .wing{transform-origin:center;transition:transform .08s}.hole.hit .penguin .wing.l{transform:rotate(12deg)}.hole.hit .penguin .wing.r{transform:rotate(-12deg)}
  .fox .pain-eye,.fox .pain-mouth,.fox .pain-blush{display:none}.hole.hit .fox .normal-eye,.hole.hit .fox .normal-mouth{display:none}.hole.hit .fox .pain-eye,.hole.hit .fox .pain-mouth,.hole.hit .fox .pain-blush{display:block}
  .hole.hit .fox .ear-l{transform:rotate(-5deg);transform-origin:38px 31px}.hole.hit .fox .ear-r{transform:rotate(5deg);transform-origin:82px 31px}
  .hole.bear-warning .mole{animation:bearwarn .18s ease-in-out 2}
  .hole.bear-sneaky .mole{bottom:-2%;transition:bottom .2s ease-in}
  .hole.bear-pain .mole{animation:bearshake .18s linear 2}
  .hole.bear-sad .mole{bottom:-22%;transition:bottom .34s ease-in}
  @keyframes bearwarn{50%{transform:translateY(-3px) rotate(-1deg)}}
  @keyframes bearshake{25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}

  .controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:12px}.btn,select{border:0;border-radius:15px;font:inherit;font-weight:800}.btn{padding:13px 17px;background:#fff;box-shadow:inset 0 0 0 1px #dce7df;cursor:pointer}.btn.primary{background:var(--accent);box-shadow:none}.btn:active{transform:translateY(1px)}select{padding:0 34px 0 14px;background:#fff;min-width:118px}
  .progress{height:8px;background:rgba(255,255,255,.5);border-radius:999px;overflow:hidden}.bar{height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--accent),var(--danger));transform-origin:left;transition:transform .1s linear}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(34,49,40,.34);backdrop-filter:blur(5px);z-index:20;border-radius:22px;opacity:0;visibility:hidden;transition:.2s}.overlay.show{opacity:1;visibility:visible}.modal{width:min(410px,88%);background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal h2{font-size:31px;margin:0 0 8px}.modal p{margin:7px 0 18px;line-height:1.6}.bigscore{font-size:52px;font-weight:950;color:var(--good);line-height:1}.tiny{font-size:12px;opacity:.62}
  .toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-8px);z-index:30;font-weight:900;font-size:24px;opacity:0;pointer-events:none;text-shadow:0 2px 0 #fff}.toast.show{animation:pop .55s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,4px) scale(.8)}25%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-28px) scale(1)}}
  @media(max-width:560px){body{align-items:start}.top{grid-template-columns:1fr}.brand{text-align:center}.scoreboard{min-height:68px}.card{padding:10px}.board{gap:6px}.hole{border-radius:18px}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1;grid-row:1}.controls select{width:100%;min-height:45px}.controls .btn:not(.primary){min-height:45px}}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="cloud"></div><div class="cloud two"></div>
<main class="game" aria-label="打企鵝與北極狐遊戲">
  <section class="top">
    <div class="brand"><h1>🔨 雪地敲敲樂</h1><p>打企鵝、打北極狐；小心別敲到北極熊！</p></div>
    <div class="scoreboard" aria-live="polite">
      <div class="stat"><div class="label">分數</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">連擊</div><div class="value" id="combo">0</div></div>
      <div class="stat"><div class="label">時間</div><div class="value hot" id="time">30</div></div>
    </div>
  </section>

  <section class="card" style="position:relative">
    <div class="board" id="board" aria-label="遊戲區"></div>
    <div class="overlay show" id="overlay">
      <div class="modal">
        <h2 id="modalTitle">準備好了嗎？</h2>
        <div class="bigscore" id="finalScore" hidden>0</div>
        <p id="modalText">企鵝 <b>+1</b>、北極狐 <b>+3</b>，誤敲北極熊會 <b>-2</b> 並中斷連擊。</p>
        <button class="btn primary" id="modalBtn" style="width:100%">開始遊戲</button>
        <p class="tiny">支援手機觸控、滑鼠；最高分會儲存在這台裝置。</p>
      </div>
    </div>
  </section>

  <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
  <section class="controls">
    <button class="btn primary" id="startBtn">開始 / 重新開始</button>
    <select id="difficulty" aria-label="難度">
      <option value="easy">悠閒</option><option value="normal" selected>普通</option><option value="hard">高手</option>
    </select>
    <button class="btn" id="soundBtn" aria-pressed="true">🔊 音效</button>
  </section>
  <div class="tiny" style="text-align:center">最高分：<b id="best">0</b> · 完全離線，不會傳送任何資料</div>
</main>
<div class="toast" id="toast">+1</div>
<script>
(() => {
  'use strict';
  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score'), comboEl = document.getElementById('combo'), timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best'), bar = document.getElementById('bar'), overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle'), modalText = document.getElementById('modalText'), modalBtn = document.getElementById('modalBtn'), finalScore = document.getElementById('finalScore');
  const startBtn = document.getElementById('startBtn'), difficulty = document.getElementById('difficulty'), soundBtn = document.getElementById('soundBtn'), toast = document.getElementById('toast');

  const holes = [];
  const bearImages = {
    peek: 'assets/bear_peek.webp',
    warning: 'assets/bear_warning.webp',
    sneaky: 'assets/bear_sneaky.webp',
    pain: 'assets/bear_pain.webp',
    sad: 'assets/bear_sad.webp'
  };
  for (let i=0;i<9;i++) {
    const h=document.createElement('button'); h.className='hole'; h.type='button'; h.setAttribute('aria-label',`洞 ${i+1}`);
    h.innerHTML=`<div class="mole">
      <svg class="character penguin" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="93" rx="35" ry="20" fill="#1f2a2a" class="outline"/>
        <ellipse cx="60" cy="65" rx="36" ry="43" fill="#263238" class="outline"/>
        <ellipse cx="60" cy="72" rx="24" ry="31" fill="#fffdf7"/>
        <path class="wing l outline" d="M29 59 Q12 68 20 88 Q31 77 39 69Z" fill="#263238"/>
        <path class="wing r outline" d="M91 59 Q108 68 100 88 Q89 77 81 69Z" fill="#263238"/>
        <ellipse cx="47" cy="53" rx="4" ry="5" fill="#18201f"/><ellipse cx="73" cy="53" rx="4" ry="5" fill="#18201f"/>
        <path d="M54 61 L66 61 L60 69Z" fill="#ffb347" class="soft"/>
        <ellipse cx="39" cy="108" rx="13" ry="5" fill="#ffb347" class="soft"/><ellipse cx="81" cy="108" rx="13" ry="5" fill="#ffb347" class="soft"/>
        <circle cx="39" cy="65" r="5" fill="#ffb8c5" opacity=".65"/><circle cx="81" cy="65" r="5" fill="#ffb8c5" opacity=".65"/>
      </svg>
      <svg class="character fox" viewBox="0 0 120 120" aria-hidden="true">
        <path class="ear-l outline" d="M28 42 L34 13 L51 37Z" fill="#fffaf2"/><path class="ear-r outline" d="M92 42 L86 13 L69 37Z" fill="#fffaf2"/>
        <path d="M34 29 L37 20 L45 34Z" fill="#f4c6c8"/><path d="M86 29 L83 20 L75 34Z" fill="#f4c6c8"/>
        <ellipse cx="60" cy="68" rx="39" ry="38" fill="#fffaf2" class="outline"/>
        <path d="M24 76 Q20 102 43 105 Q32 90 38 82Z" fill="#fffaf2" class="outline"/>
        <path d="M96 76 Q100 102 77 105 Q88 90 82 82Z" fill="#fffaf2" class="outline"/>
        <ellipse class="normal-eye" cx="45" cy="61" rx="4" ry="5" fill="#26332d"/><ellipse class="normal-eye" cx="75" cy="61" rx="4" ry="5" fill="#26332d"/>
        <path class="pain-eye soft" d="M39 61 Q45 55 51 61" fill="none"/><path class="pain-eye soft" d="M69 61 Q75 55 81 61" fill="none"/>
        <ellipse cx="60" cy="72" rx="5" ry="4" fill="#26332d"/>
        <path class="normal-mouth soft" d="M60 76 Q54 82 49 78 M60 76 Q66 82 71 78" fill="none"/>
        <path class="pain-mouth soft" d="M50 84 Q60 75 70 84 Q60 91 50 84Z" fill="#ffb8c5"/>
        <ellipse class="pain-blush" cx="38" cy="76" rx="8" ry="5" fill="#ffb8c5" opacity=".8"/><ellipse class="pain-blush" cx="82" cy="76" rx="8" ry="5" fill="#ffb8c5" opacity=".8"/>
        <path class="pain-blush soft" d="M86 47 q8 5 1 12 q-7-6-1-12Z" fill="#a8dcff"/>
      </svg>
      <img class="bear-img" alt="" aria-hidden="true" />
    </div>`;
    board.appendChild(h); holes.push(h);
  }

  let score=0, combo=0, maxCombo=0, timeLeft=30, running=false, lastHole=-1, spawnTimer=null, clockTimer=null, hideTimer=null, bearStageTimer=null, reactionTimer=null, current=-1, currentType='normal', soundOn=true, audioCtx=null;
  const settings={easy:{spawn:1050,show:780},normal:{spawn:850,show:600},hard:{spawn:650,show:470}};
  const bearStateClasses=['bear-warning','bear-sneaky','bear-pain','bear-sad'];
  let best=Number(localStorage.getItem('wam_best_v1')||0); bestEl.textContent=best;

  function beep(freq=440,dur=.06,type='sine',vol=.055){
    if(!soundOn) return;
    try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);}catch(e){}
  }
  function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }
  function update(){scoreEl.textContent=score;comboEl.textContent=combo;timeEl.textContent=Math.max(0,Math.ceil(timeLeft));bar.style.transform=`scaleX(${Math.max(0,timeLeft/30)})`;}
  function clearMole(){
    holes.forEach(h=>{
      h.classList.remove('up','hit',...bearStateClasses);
      const m=h.querySelector('.mole'); m.className='mole'; delete m.dataset.bearState;
    });
    current=-1;
    clearTimeout(hideTimer); clearTimeout(bearStageTimer); clearTimeout(reactionTimer);
  }
  function setBearState(h,state){
    const m=h.querySelector('.mole'), img=m.querySelector('.bear-img');
    m.dataset.bearState=state; img.src=bearImages[state];
    h.classList.remove(...bearStateClasses);
    if(state==='warning')h.classList.add('bear-warning');
    if(state==='sneaky')h.classList.add('bear-sneaky');
    if(state==='pain')h.classList.add('bear-pain');
    if(state==='sad')h.classList.add('bear-sad');
  }
  function pickHole(){let n; do{n=Math.floor(Math.random()*holes.length)}while(n===lastHole); lastHole=n; return n;}
  function scheduleSpawn(ms){clearTimeout(spawnTimer);spawnTimer=setTimeout(spawn,ms);}
  function spawn(){
    if(!running)return;
    clearMole(); current=pickHole(); const r=Math.random(); currentType=r<.12?'bad':r<.34?'bonus':'normal';
    const h=holes[current], m=h.querySelector('.mole'); m.className='mole '+currentType;
    h.classList.add('up'); h.setAttribute('aria-label', currentType==='bad'?'北極熊，別打！':currentType==='bonus'?'北極狐，+3 分':'企鵝，+1 分');
    const cfg=settings[difficulty.value];
    if(currentType==='bad'){
      setBearState(h,'peek');
      bearStageTimer=setTimeout(()=>{
        if(running&&current>=0&&currentType==='bad'&&h.classList.contains('up')) setBearState(h,'warning');
      },Math.round(cfg.show*.62));
      hideTimer=setTimeout(()=>{
        if(running&&current>=0&&currentType==='bad'){
          h.classList.remove('up'); setBearState(h,'sneaky'); current=-1; update();
        }
      },cfg.show);
    } else {
      hideTimer=setTimeout(()=>{
        if(running&&current>=0){
          h.classList.remove('up'); current=-1; combo=0; update();
        }
      },cfg.show);
    }
    scheduleSpawn(cfg.spawn);
  }
  function showToast(text){toast.textContent=text;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');}
  function hit(i){
    if(!running||i!==current||!holes[i].classList.contains('up'))return;
    const h=holes[i];
    h.classList.remove('up'); h.classList.add('hit');
    clearTimeout(hideTimer); clearTimeout(bearStageTimer);
    let delta=1;
    if(currentType==='bad'){
      delta=-2; combo=0; beep(120,.12,'sawtooth',.07); vibrate(55); showToast('誤敲北極熊 -2');
      clearTimeout(spawnTimer);
      setBearState(h,'pain');
      reactionTimer=setTimeout(()=>{
        if(!running)return;
        h.classList.remove('hit'); setBearState(h,'sad');
        reactionTimer=setTimeout(()=>{
          if(!running)return;
          h.classList.remove(...bearStateClasses); h.querySelector('.mole').className='mole'; scheduleSpawn(80);
        },340);
      },220);
    }
    else if(currentType==='bonus'){delta=3;combo++;maxCombo=Math.max(maxCombo,combo);beep(760,.08,'triangle',.06);vibrate(18);showToast('北極狐 +3');}
    else {combo++;maxCombo=Math.max(maxCombo,combo);beep(420+Math.min(combo,12)*25,.055,'sine',.05);vibrate(10);showToast('企鵝 +1');}
    if(currentType!=='bad' && combo>0 && combo%5===0){delta+=1;showToast(`連擊獎勵 +${delta}`)}
    score=Math.max(0,score+delta); current=-1; update();
  }
  holes.forEach((h,i)=>h.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)}));

  function start(){
    clearTimeout(spawnTimer);clearInterval(clockTimer);clearTimeout(hideTimer);clearMole();
    score=0;combo=0;maxCombo=0;timeLeft=30;running=true;overlay.classList.remove('show');finalScore.hidden=true;update();beep(520,.08,'triangle');spawn();
    const started=performance.now();
    clockTimer=setInterval(()=>{timeLeft=30-(performance.now()-started)/1000;if(timeLeft<=0){timeLeft=0;finish()}update()},100);
  }
  function finish(){
    if(!running)return;running=false;clearTimeout(spawnTimer);clearInterval(clockTimer);clearMole();beep(260,.09,'triangle');setTimeout(()=>beep(390,.12,'triangle'),100);
    if(score>best){best=score;localStorage.setItem('wam_best_v1',best);bestEl.textContent=best;modalTitle.textContent='🏆 新紀錄！'}else modalTitle.textContent='時間到！';
    finalScore.textContent=score;finalScore.hidden=false;modalText.innerHTML=`你這局得到 <b>${score}</b> 分，最高連擊 <b>${maxCombo}</b>。再來一局挑戰更高分吧！`;modalBtn.textContent='再玩一次';overlay.classList.add('show');
  }
  startBtn.addEventListener('click',start);modalBtn.addEventListener('click',start);
  soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 音效':'🔇 靜音';soundBtn.setAttribute('aria-pressed',String(soundOn));if(soundOn)beep(520)});
  difficulty.addEventListener('change',()=>{if(running)start()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)finish()});
  update();
})();
</script>
<!--
Reference / inspiration (no runtime dependency; all game code/assets in this file are self-contained). Penguin/fox art is original SVG. The polar-bear five-state artwork is an original generated adaptation based on the user-provided visual references; it is embedded locally and has no runtime network dependency:
1) MDN setInterval(): https://developer.mozilla.org/en-US/docs/Web/API/Window/setInterval

3) CSS-Tricks - Whack-a-Mole: The CSS Edition: https://css-tricks.com/whack-a-mole-the-css-edition/
-->
</body>
</html>
